out_dir: 'minicif_pxrd_encoder_pretrain_bragg_artifacts'
dataset: 'data/noma_minicif_v2'
split: 'train'
device: 'cuda'
dtype: 'bfloat16'
seed: 1337

batch_size: 128
num_workers_dataloader: 4
dataloader_multiprocessing_context: 'spawn'
dataloader_timeout_seconds: 120
pin_memory: False
max_raw_peaks_per_sample: 2048
resume: True
resume_from: ''
save_on_interrupt: True
max_runtime_seconds: 0
max_iters: 20_000
eval_interval: 500
log_interval: 20
plot_interval: 20
plot_window: 500
live_plot: True
learning_rate: 1e-3
weight_decay: 0.1
beta2: 0.99
temperature: 0.1
projection_dim: 128

condition_encoder: 'hybrid'
condition_n_tokens: 32
dense_condition_n_tokens: 16
peak_condition_n_tokens: 16
peak_encoder_hidden_dim: 128
n_embd: 256
n_head: 4
dropout: 0.0
pxrd_encoder_channels: 64
pxrd_encoder_kernel_size: 7

qmin: 0.0
qmax: 10.0
qstep: 0.01
nyquist_points_per_fwhm: 0
xrd_artifact_config: 'configs/xrd_artifacts/full_training.yaml'
final_normalize_xrd: True
max_xrd_peaks: 512
max_peak_list_peaks: 512
