# Small end-to-end validation run for the symmetry-aware minicif_v2 representation.
# Prepare with: sbatch minislurm/prepare_minicif_v2_dataset.sh

out_dir: 'minicif_v2_model_small'
eval_interval: 250
eval_iters_train: 20
eval_iters_val: 20
log_interval: 20
metrics_log_interval: 20
init_from: 'scratch'

device: 'cuda'
dtype: 'bfloat16'
compile: False
fused_optimizer: True

always_save_checkpoint: False
validate: True

dataset: 'data/noma_minicif_v2'
tokenizer: 'minicif_v2'
batching_strategy: 'record'
length_bucket_size: 2048
batch_size: 64
batch_token_budget: 12288
block_size: 640
num_workers_dataloader: 4
sampling_strategy: 'crystal_system_balanced'

n_layer: 4
n_head: 4
n_embd: 128
dropout: 0.1
typed_token_heads: True

learning_rate: 8e-4
gradient_accumulation_steps: 5
max_iters: 20_000
lr_decay_iters: 20_000
min_lr: 8e-5
weight_decay: 0.1
beta2: 0.99
warmup_iters: 200
early_stopping_patience: 20

condition: True
condition_encoder: 'peak_fourier'
condition_n_tokens: 16
peak_fourier_bands: 8
max_peak_list_peaks: 512
condition_cross_attention: True
condition_cross_attention_every_n_layers: 2
condition_dropout_prob: 0.1
boundary_masking: True
minicif_constrained_decoding: True

qmin: 0.0
qmax: 10.0
q_shift_range_min: -0.01
q_shift_range_max: 0.01
q_scale_range_min: 0.998
q_scale_range_max: 1.002
intensity_scale_range_min: 0.9
intensity_scale_range_max: 1.0
peak_intensity_jitter_range_min: 0.9
peak_intensity_jitter_range_max: 1.1
peak_dropout_prob: 0.02
xrd_augmentation_on_device: True
