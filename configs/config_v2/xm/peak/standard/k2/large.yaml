out_dir: 'models/minicif_v2/xm/peak/standard/k2/large'
eval_interval: 500
eval_iters_train: 100
eval_iters_val: 100
log_interval: 20
metrics_log_interval: 20
init_from: 'scratch'

device: 'cuda'
dtype: 'bfloat16'
compile: False
fused_optimizer: True
always_save_checkpoint: False
validate: True

dataset: 'data/noma_minicif_v2'
tokenizer: 'minicif_v2'
batching_strategy: 'record'
length_bucket_size: 4096
batch_size: 64
batch_token_budget: 24576
block_size: 768
num_workers_dataloader: 8
sampling_strategy: 'crystal_system_balanced'

n_layer: 8
n_head: 8
n_embd: 512
dropout: 0.1
typed_token_heads: True
xm_best_of_k: 2

learning_rate: 3e-4
gradient_accumulation_steps: 6
max_iters: 100_000
lr_decay_iters: 100_000
min_lr: 3e-5
weight_decay: 0.15
beta2: 0.99
warmup_iters: 1000
early_stopping_patience: 20

condition: True
condition_encoder: 'peak_fourier'
condition_n_tokens: 32
peak_encoder_hidden_dim: 256
peak_fourier_bands: 12
max_peak_list_peaks: 512
condition_cross_attention: True
condition_cross_attention_every_n_layers: 2
condition_dropout_prob: 0.1
boundary_masking: True
minicif_constrained_decoding: True

qmin: 0.0
qmax: 10.0
q_shift_range_min: -0.02
q_shift_range_max: 0.02
q_scale_range_min: 0.998
q_scale_range_max: 1.002
intensity_scale_range_min: 0.9
intensity_scale_range_max: 1.0
peak_intensity_jitter_range_min: 0.9
peak_intensity_jitter_range_max: 1.1
peak_dropout_prob: 0.02
xrd_augmentation_on_device: True
