out_dir: 'models/minicif_v2/hybrid/standard/small'
eval_interval: 500
eval_iters_train: 100
eval_iters_val: 100
log_interval: 20
metrics_log_interval: 20
init_from: 'scratch'

device: 'cuda'
dtype: 'bfloat16'
compile: False
fused_optimizer: True
always_save_checkpoint: False
validate: True

dataset: 'data/noma_minicif_v2'
tokenizer: 'minicif_v2'
batching_strategy: 'record'
length_bucket_size: 4096
batch_size: 64
batch_token_budget: 16384
block_size: 768
num_workers_dataloader: 8
sampling_strategy: 'crystal_system_balanced'

n_layer: 4
n_head: 4
n_embd: 128
dropout: 0.1
typed_token_heads: True

learning_rate: 8e-4
gradient_accumulation_steps: 6
max_iters: 100_000
lr_decay_iters: 100_000
min_lr: 8e-5
weight_decay: 0.1
beta2: 0.99
warmup_iters: 1000
early_stopping_patience: 20

condition: True
condition_encoder: 'hybrid'
hybrid_dense_encoder: 'conv'
condition_n_tokens: 16
dense_condition_n_tokens: 8
peak_condition_n_tokens: 8
peak_encoder_hidden_dim: 64
pxrd_encoder_channels: 32
pxrd_encoder_kernel_size: 7
max_xrd_peaks: 512
max_peak_list_peaks: 512
condition_cross_attention: True
condition_cross_attention_every_n_layers: 2
condition_dropout_prob: 0.1
boundary_masking: True
minicif_constrained_decoding: True

qmin: 0.0
qmax: 10.0
qstep: 0.01
nyquist_points_per_fwhm: 0
xrd_artifact_config: 'configs/xrd_artifacts/full_training.yaml'
xrd_augmentation_on_device: True
