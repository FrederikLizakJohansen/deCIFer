# Two-step CUDA integration check for the full BraggCalculator artifact path.

out_dir: 'minicif_v2_hybrid_artifacts_smoke'
eval_interval: 100
log_interval: 1
metrics_log_interval: 1
init_from: 'scratch'

device: 'cuda'
dtype: 'bfloat16'
compile: False
fused_optimizer: True

always_save_checkpoint: False
validate: False

dataset: 'data/noma_minicif_v2'
tokenizer: 'minicif_v2'
batching_strategy: 'record'
length_bucket_size: 256
batch_size: 4
batch_token_budget: 2048
block_size: 768
num_workers_dataloader: 0
sampling_strategy: 'random'

n_layer: 2
n_head: 4
n_embd: 64
dropout: 0.1
typed_token_heads: True

learning_rate: 1e-3
gradient_accumulation_steps: 1
max_iters: 2
decay_lr: False
weight_decay: 0.1
beta2: 0.99

condition: True
condition_encoder: 'hybrid'
hybrid_dense_encoder: 'conv'
condition_n_tokens: 16
dense_condition_n_tokens: 8
peak_condition_n_tokens: 8
peak_encoder_hidden_dim: 64
max_xrd_peaks: 256
max_peak_list_peaks: 256
condition_cross_attention: True
condition_cross_attention_every_n_layers: 1
condition_dropout_prob: 0.1
boundary_masking: True
minicif_constrained_decoding: True

qmin: 0.0
qmax: 10.0
qstep: 0.02
nyquist_points_per_fwhm: 0
xrd_artifact_config: 'configs/xrd_artifacts/full_training.yaml'
xrd_augmentation_on_device: True
